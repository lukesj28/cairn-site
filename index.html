    <main class="journey">
      <div class="stage">
        <div id="reel" class="reel" aria-hidden="true"></div>
        <h1 class="visually-hidden">cairn</h1>
        <div id="helper" class="helper">
          <button type="button" class="helper__body" aria-label="Ask about cairn" inert>
            <span class="helper__art is-out"></span>
          </button>
          <button type="button" class="perch" aria-label="Scroll down" inert>
            <span class="helper__art is-out"></span>
          </button>
          <div class="helper__bubble" data-no-swipe role="group" aria-label="cairn’s helper" inert>
            <p class="helper__asked" hidden></p>
            <p class="helper__say" aria-live="polite"></p>
          </div>
          <form class="helper__ask" data-no-swipe inert>
            <input type="text" name="q" placeholder="ask about cairn" aria-label="Ask a question about cairn" maxlength="500" autocomplete="off" enterkeyhint="send" />
            <button type="submit" class="helper__send" aria-label="Ask" data-icon="arrow-up"></button>
            <p class="helper__note">answers may be AI-generated · <a href="/privacy">privacy</a></p>
          </form>
          <figure class="helper__clip" inert hidden>
            <div class="helper__holo">
              <div class="helper__screen">
                <video muted loop playsinline preload="auto" disablepictureinpicture></video>
              </div>
              <div class="helper__clip-tools">
                <button type="button" class="helper__clip-btn helper__clip-close" aria-label="Close video" data-icon="x"></button>
                <button type="button" class="helper__clip-btn helper__clip-full" aria-label="Play video full screen" data-icon="corners-out"></button>
              </div>
            </div>
            <div class="helper__glints" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </figure>
        </div>
        <canvas id="cairn" aria-hidden="true"></canvas>
        <div id="stones" class="stones" role="group" aria-label="The cairn" inert></div>
        <canvas id="word" aria-hidden="true"></canvas>

        <div id="get" class="get">
          <a
            class="pill pill--hero"
            href="https://github.com/lukesj28/cairn/releases/latest/download/Cairn.dmg"
            draggable="false"
          >
            <span>Download for Mac</span>
          </a>
        </div>

        <div id="signoff" class="signoff">
          <p>
            <span class="signoff__mouse">hover a stone to see where it leads</span>
            <span class="signoff__touch">tap a stone to see where it leads</span>
          </p>
        </div>

        <div class="bar" aria-hidden="true"></div>
      </div>
