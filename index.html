<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23006ce5'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='12' cy='18' r='6'/%3E%3Ccircle cx='19' cy='15' r='7'/%3E%3Ccircle cx='24' cy='19' r='4.5'/%3E%3Crect x='8' y='18' width='19' height='5.5' rx='2.75'/%3E%3C/g%3E%3C/svg%3E" />
    <title>cairn</title>
    <link rel="preload" as="image" href="https://cdn.cairnstacks.app/hero/poster.webp" />
  </head>
  <body>
    <main class="journey">
      <div class="stage">
        <div id="reel" class="reel" aria-hidden="true"></div>
        <h1 class="visually-hidden">cairn</h1>
        <div id="buddy" class="buddy">
          <button type="button" class="buddy__body" aria-label="Scroll down">
            <!-- the character: swap src/buddy.svg (facing us) and src/buddy-back.svg (facing away),
                 and --buddy-w / --buddy-h in style.css -->
            <span class="buddy__art">
              <span class="buddy__turn">
                <img src="/src/buddy.svg" alt="" draggable="false" />
                <img class="buddy__back" src="/src/buddy-back.svg" alt="" draggable="false" />
              </span>
            </span>
          </button>
          <div class="buddy__bubble" role="group" aria-label="cairn’s helper" inert>
            <p class="buddy__asked" hidden></p>
            <p class="buddy__say" aria-live="polite"></p>
            <form class="buddy__ask" hidden>
              <input type="text" name="q" placeholder="ask about cairn" aria-label="Ask a question about cairn" maxlength="500" autocomplete="off" enterkeyhint="send" />
              <button type="submit" class="buddy__send" aria-label="Ask" data-icon="arrow-up"></button>
            </form>
          </div>
        </div>
        <canvas id="cairn" aria-hidden="true"></canvas>
        <div id="stones" class="stones" role="group" aria-label="The cairn" inert></div>
        <canvas id="word" aria-hidden="true"></canvas>

        <div id="get" class="get">
          <a
            class="pill pill--hero"
            href="https://github.com/lukesj28/cairn/releases/latest/download/Cairn.dmg"
            draggable="false"
          >
            <span class="icon icon--apple" data-icon="apple" aria-hidden="true"></span>
            <span>Download for Mac</span>
          </a>
        </div>

        <footer id="signoff" class="signoff">
          <p>that’s the whole view.</p>
          <button id="back-up" type="button" class="pill">
            <span class="icon" data-icon="arrow-up" aria-hidden="true"></span>
            float back up
          </button>
        </footer>

        <div class="bar bar--top" aria-hidden="true"></div>
        <div class="bar bar--bottom" aria-hidden="true"></div>
      </div>
    </main>
    <dialog id="kofi" class="kofi" aria-labelledby="kofi-title">
      <header class="kofi__head">
        <h2 id="kofi-title">buy me a coffee</h2>
        <button type="button" class="kofi__close" aria-label="Close" data-icon="x"></button>
      </header>
      <iframe
        title="Support lukesj28 on Ko-fi"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        data-src="https://ko-fi.com/lukesj28/?hidefeed=true&widget=true&embed=true&preview=true"
      ></iframe>
      <a class="kofi__out" href="https://ko-fi.com/lukesj28" target="_blank" rel="noopener noreferrer">open on ko-fi instead</a>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
